<html lang="en">
<!--

-->
<head><meta charset="UTF-8"><title>player-page sample</title></head>
<body>
<ul class="nav nav-tabs" id="playerTab">
  <li class="dropdown">
    <a href="#" class="dropdown-toggle" data-toggle="dropdown">活动<b class="caret"></b></a>
    <ul class="dropdown-menu dropdown-menu-scroll">
      <li>
        <a class="ajaxTab delayAjaxTab" href="https://example.invalid/index.php/query/activity/100001/type/2"
           data-target="#activity-2"
           data-toggle="tab">PASS卡                    </a>
      </li>
      <li>
        <a class="ajaxTab delayAjaxTab" href="https://example.invalid/index.php/query/activity/100001/type/81"
           data-target="#activity-81"
           data-toggle="tab">体力排行榜                    </a>
      </li>
    </ul>
  </li>
</ul>

<div class="tab-content form-horizontal">
  <div class="tab-pane" id="instructionLog">
    <form class="tab-pane-form form-inline" action="https://example.invalid/index.php/query/instructionLog/100001">
      <label>
        <select name="opFrom" class="selectpicker" data-live-search="true" data-size="10">
          <option value="-1"> 全部来源</option>
          <option value="1">默认</option>
          <option value="252">集卡活动-结算</option>
          <option value="253">联动分享活动-首次赠送</option>
          <option value="257">打怪棋盘-消耗步数</option>
        </select>
      </label>
    </form>
  </div>

  <div class="tab-pane" id="goldLog">
    <form class="tab-pane-form form-inline" action="https://example.invalid/index.php/query/goldLog/100001">
      <label>
        <select name="from" class="selectpicker" data-live-search="true" data-size="10">
          <option value="-1"> 全部来源</option>
          <option value="1">默认</option>
          <option value="252">集卡活动-结算</option>
          <option value="253">联动分享活动-首次赠送</option>
        </select>
      </label>
      <label>
        <select name="logType" class="selectpicker">
          <option value="-1">记录类型</option>
          <option value="1">增加</option>
        </select>
      </label>
    </form>
  </div>
</div>

<div class="modal fade" id="modal-present">
  <select name="presentGoodsType[]" class="presentGoodsType selectpicker" data-live-search="true" data-size="20">
    <option value="-1">请选择...</option>
    <option value="100">100---货币</option>
    <option value="150">150---卡包</option>
    <option value="10000">10000---棋子</option>
  </select>
</div>
