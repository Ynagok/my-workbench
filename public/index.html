                    function importImageFromFile(file) {
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = function (event) {
                            const img = new Image();
                            img.onerror = function () { alert('图片加载失败'); };
                            img.onload = function () {
                                try {
                                    const tempCanvas = document.createElement('canvas');
                                    tempCanvas.width = gridSize;
                                    tempCanvas.height = gridSize;
                                    const tempCtx = tempCanvas.getContext('2d');
                                    const fillMode = document.getElementById('pixelFillMode').value;

                                    if (fillMode === 'stretch') {
                                        tempCtx.drawImage(img, 0, 0, gridSize, gridSize);
                                    } else if (fillMode === 'cover') {
                                        const scale = Math.max(gridSize / img.width, gridSize / img.height);
                                        const srcW = gridSize / scale;
                                        const srcH = gridSize / scale;
                                        const srcX = (img.width - srcW) / 2;
                                        const srcY = (img.height - srcH) / 2;
                                        tempCtx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, gridSize, gridSize);
                                    } else if (fillMode === 'contain') {
                                        tempCtx.fillStyle = '#ffffff';
                                        tempCtx.fillRect(0, 0, gridSize, gridSize);
                                        const scale = Math.min(gridSize / img.width, gridSize / img.height);
                                        const drawW = img.width * scale;
                                        const drawH = img.height * scale;
                                        const offsetX = (gridSize - drawW) / 2;
                                        const offsetY = (gridSize - drawH) / 2;
                                        tempCtx.drawImage(img, offsetX, offsetY, drawW, drawH);
                                    }

                                    const imageData = tempCtx.getImageData(0, 0, gridSize, gridSize).data;
                                    initPixelCanvas();

                                    const totalCells = gridSize * gridSize;
                                    const step = Math.max(1, Math.floor(totalCells / 200));
                                    let currentCell = 0;

                                    function fillNextBatch() {
                                        const end = Math.min(currentCell + step, totalCells);
                                        for (let i = currentCell; i < end; i++) {
                                            const row = Math.floor(i / gridSize);
                                            const col = i % gridSize;
                                            const pixelIndex = (row * gridSize + col) * 4;
                                            const r = imageData[pixelIndex];
                                            const g = imageData[pixelIndex + 1];
                                            const b = imageData[pixelIndex + 2];
                                            const a = imageData[pixelIndex + 3];
                                            const origColor = (a > 128) ? `rgb(${r},${g},${b})` : '#ffffff';
                                            const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
                                            const color = (a > 128) ? findClosestPaletteColor(hex) : '#ffffff';
                                            ctx.fillStyle = color;
                                            ctx.fillRect(col * cellSize + 1, row * cellSize + 1, cellSize - 2, cellSize - 2);
                                        }
                                        currentCell = end;
                                        if (currentCell < totalCells) {
                                            setTimeout(fillNextBatch, 10);
                                        }
                                    }
                                    fillNextBatch();
                                } catch (error) {
                                    console.error(error);
                                    alert('图片处理失败');
                                }
                            };
                            img.src = event.target.result;
                        };
                        reader.onerror = function () { alert('文件读取失败'); };
                        reader.readAsDataURL(file);
                    }

                        const b = parseInt(hexcolor.substr(4, 2), 16);

                // ==================== 导出图纸 ====================
                    function exportBlueprint() {
                        const originalCanvas = pixelCanvas;
                        const exportScale = 10;   // 高清倍数

                        // 创建导出画布
                        const exportCanvas = document.createElement('canvas');
                        exportCanvas.width = originalCanvas.width * exportScale;
                        exportCanvas.height = originalCanvas.height * exportScale;
                        const exportCtx = exportCanvas.getContext('2d');

                        // 背景白色
                        exportCtx.fillStyle = '#ffffff';
                        exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

                        // 绘制原画布（放大）
                        exportCtx.drawImage(originalCanvas, 0, 0, exportCanvas.width, exportCanvas.height);

                        // 获取主画布像素数据（一次性）
                        const mainImageData = ctx.getImageData(0, 0, originalCanvas.width, originalCanvas.height).data;
                        const scaledCell = cellSize * exportScale;

                        // 设置文字样式
                        const baseFontSize = Math.max(5, cellSize * 0.4);
                        exportCtx.font = `${baseFontSize * exportScale}px sans-serif`;
                        exportCtx.textAlign = 'center';
                        exportCtx.textBaseline = 'middle';

                        // 遍历每个格子，标注色号
                        for (let row = 0; row < gridSize; row++) {
                            for (let col = 0; col < gridSize; col++) {
                                // 计算在主画布上的像素索引
                                const px = Math.floor(col * cellSize + cellSize / 2);
                                const py = Math.floor(row * cellSize + cellSize / 2);
                                const dataIndex = (py * originalCanvas.width + px) * 4;
                                const r = mainImageData[dataIndex];
                                const g = mainImageData[dataIndex + 1];
                                const b = mainImageData[dataIndex + 2];
                                const a = mainImageData[dataIndex + 3];

                                // 跳过完全透明或白色背景
                                if (a === 0 || (r === 255 && g === 255 && b === 255)) continue;

                                // 转换为十六进制颜色
                                const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');

                                // 查找色号，若找不到则尝试吸附后查找
                                let label = colorToLabel[hex];
                                if (!label) {
                                    const closest = findClosestPaletteColor(hex);
                                    label = colorToLabel[closest] || null;
                                }
                                if (!label) continue;

                                // 文字颜色（黑或白）
                                exportCtx.fillStyle = getContrastYIQ(hex);
                                const centerX = col * scaledCell + scaledCell / 2;
                                const centerY = row * scaledCell + scaledCell / 2;
                                exportCtx.fillText(label, centerX, centerY);
                            }
                        }

                        // 触发下载
                        const link = document.createElement('a');
                        link.download = '拼豆图纸.png';
                        link.href = exportCanvas.toDataURL('image/png');
                        link.click();
                    }

                document.getElementById('pixelExportBtn').addEventListener('click', exportBlueprint);

                        let editingSourceIndex = -1;
                    function renderSourceRuleList(filterType = 'all', searchTerm = '') {
                        const c = document.getElementById('sourceRuleListContainer');
                        let filtered = sourceRules;
                        if (filterType !== 'all') filtered = filtered.filter(r => r.type === filterType);
                        if (searchTerm) { const lower = searchTerm.toLowerCase(); filtered = filtered.filter(r => (getRulePattern(r) + getRuleReplacement(r)).toLowerCase().includes(lower)); }
                        c.innerHTML = filtered.map((r, i) => {
                            const idx = sourceRules.indexOf(r);
                            const pattern = getRulePattern(r);
                            const replacement = getRuleReplacement(r) || '(删除)';
                            const typeLabel = r.type === 'source' ? '来源' : (r.type === 'reward' ? '奖励' : '棋子');
                            return `<div class="rule-item" data-idx="${idx}">
                                                        <span class="rule-pattern">${pattern}</span><span class="rule-type">[${typeLabel}]</span>
                                                        <span>→</span><span class="rule-replacement">${replacement}</span>
                                                        <div class="rule-actions"><button class="edit-source-btn" data-idx="${idx}">✏️</button><button class="delete-source-btn" data-idx="${idx}" style="background:#dc3545;">🗑️</button></div></div>`;
                        }).join('') || '<div>暂无规则</div>';
                        c.querySelectorAll('.delete-source-btn').forEach(b => b.onclick = e => { const idx = parseInt(b.dataset.idx); sourceRules.splice(idx, 1); saveData('sourceRules', sourceRules); renderSourceRuleList(filterType, searchTerm); });
                        c.querySelectorAll('.edit-source-btn').forEach(b => b.onclick = e => {
                            const idx = parseInt(b.dataset.idx); const r = sourceRules[idx];
                            document.getElementById('newRulePattern').value = getRulePattern(r);
                            document.getElementById('newRuleReplacement').value = getRuleReplacement(r) || '';
                            document.getElementById('newRuleType').value = r.type || 'source';
                            document.getElementById('addOrUpdateRuleBtn').textContent = '✏️ 更新';
                            document.getElementById('cancelEditRuleBtn').style.display = 'inline-block';
                            editingSourceIndex = idx;
                        });
                    }
                    function resetSourceEditState() { document.getElementById('newRulePattern').value = ''; document.getElementById('newRuleReplacement').value = ''; document.getElementById('newRuleType').value = 'source'; document.getElementById('addOrUpdateRuleBtn').textContent = '➕ 添加'; document.getElementById('cancelEditRuleBtn').style.display = 'none'; editingSourceIndex = -1; }
                    function renderIgnoreRuleList() { const c = document.getElementById('ignoreRuleListContainer'); c.innerHTML = ignoreKeywords.map((k, i) => `<div class="rule-item"><span class="rule-pattern">${k}</span><div class="rule-actions"><button data-i="${i}" class="delete-ignore-btn" style="background:#dc3545;">🗑️</button></div></div>`).join('') || '<div>暂无忽略关键词</div>'; c.querySelectorAll('.delete-ignore-btn').forEach(b => b.onclick = e => { ignoreKeywords.splice(e.target.dataset.i, 1); saveData('ignoreKeywords', ignoreKeywords); renderIgnoreRuleList(); }); }

                    function refreshVarEntries() { varContainer.innerHTML = ''; varInputs = {}; CORE_FIELDS.forEach(f => { const lab = document.createElement('label'); lab.textContent = f + '：'; const inp = document.createElement('input'); inp.value = ''; const btn = document.createElement('button'); btn.textContent = '📋'; btn.className = 'paste-btn'; btn.onclick = () => navigator.clipboard.readText().then(t => { const cl = cleanText(t); const tm = extractTime(cl); if (tm && varInputs['时间']) varInputs['时间'].value = tm; const val = parseInt(cl.match(/-?\d+/)?.[0]); if (!isNaN(val)) inp.value = val; }); varContainer.appendChild(lab); varContainer.appendChild(inp); varContainer.appendChild(btn); varInputs[f] = inp; }); }
                    function refreshTemplateSelect() { templateSelect.innerHTML = ''; templates.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t.substring(0, 60); templateSelect.appendChild(o); }); }
                    function renderTemplateList() {
                        const c = document.getElementById('templateList');
                        c.innerHTML = templates.map((t, i) => `<div class="rule-item"><span>${t.substring(0, 50)}</span><div class="rule-actions"><button data-i="${i}" class="edit-template-btn">✏️</button><button data-i="${i}" class="delete-template-btn" style="background:#dc3545;">🗑️</button></div></div>`).join('');
                        c.querySelectorAll('.delete-template-btn').forEach(b => b.onclick = e => { templates.splice(e.target.dataset.i, 1); saveData('templates', templates); renderTemplateList(); refreshTemplateSelect(); });
                    }

                    function bindAll() {
                        document.getElementById('smartParseBtn').onclick = smartParseAndFill;
                        document.getElementById('clearSmartBtn').onclick = () => { smartPasteInput.value = ''; globalResultArea.value = ''; debugConsole.innerHTML = ''; };
                        document.getElementById('sortOrderSelect').addEventListener('change', () => {
                            const text = globalResultArea.value.trim();
                            if (!text) return;
                            const lines = text.split('\n\n').filter(l => l.trim());
                            const sorted = sortSentencesByTime(lines, document.getElementById('sortOrderSelect').value);
                            globalResultArea.value = sorted.join('\n\n');
                        });
                        document.getElementById('uploadFlowBtn').onclick = async () => {
                            const mode = document.querySelector('input[name="parseMode"]:checked').value;
                            const file = document.getElementById('flowFileInput').files[0];
                            if (!file) return;
                            expandDebugConsole();
                            const text = await file.text();
                            if (mode === 'itemFlow') {
                                debugConsole.innerHTML = '🔍 道具流水（文件）解析...';
                                let sentences = parseItemFlowLog(text);
                                if (sentences.length) {
                                    const sortOrder = document.getElementById('sortOrderSelect').value;
                                    sentences = sortSentencesByTime(sentences, sortOrder);
                                    sentences = sentences.map(s => applyAllConversions(s));
                                    globalResultArea.value = sentences.join('\n\n');
                                    globalResultCount.textContent = `${sentences.length} 条`;
                                    resultSourceHint.textContent = '道具流水（上传）';
                                    navigator.clipboard.writeText(globalResultArea.value);
                                    debugConsole.innerHTML += '\n✅ 完成';
                                } else { debugConsole.innerHTML += '\n❌ 无有效记录'; }
                                return;
                            } else { processFlowCsv(); }
                        };
                        document.getElementById('debugFlowBtn').onclick = async () => { const f = document.getElementById('flowFileInput').files[0]; if (!f) return; const text = await f.text(); expandDebugConsole(); debugConsole.innerHTML = `CSV前200字符:\n${text.substring(0, 200)}`; };
                        document.getElementById('copyGlobalResultBtn').onclick = () => navigator.clipboard.writeText(globalResultArea.value);
                        document.getElementById('exportGlobalResultBtn').onclick = () => { const blob = new Blob([globalResultArea.value], { type: 'text/plain' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'script.txt'; a.click(); };
                        document.getElementById('generateFromTemplateBtn').onclick = () => {
                            let tpl = templateSelect.value;
                            for (let [k, v] of Object.entries(varInputs)) tpl = tpl.replace(new RegExp(`\\{${k}\\}`, 'g'), v.value);
                            tpl = tpl.replace(/\{[^}]+\}/g, '');
                            tpl = applyAllConversions(tpl);
                            globalResultArea.value = tpl;

                        const modals = {
                            source: document.getElementById('sourceRuleModal'), ignore: document.getElementById('ignoreRuleModal'),
                            template: document.getElementById('templateModal'), script: document.getElementById('scriptEditModal'),
                            batch: document.getElementById('batchTagModal'), tags: document.getElementById('manageTagsModal'),
                            import: document.getElementById('importScriptModal')
                        };
                        document.getElementById('manageSourceRulesBtn').onclick = () => { renderSourceRuleList(document.getElementById('ruleTypeFilter').value, document.getElementById('ruleSearchInput').value); modals.source.style.display = 'block'; };
                        document.getElementById('manageIgnoreRulesBtn').onclick = () => { renderIgnoreRuleList(); modals.ignore.style.display = 'block'; };
                        document.getElementById('manageTemplatesBtn').onclick = () => { renderTemplateList(); modals.template.style.display = 'block'; };
                        document.getElementById('closeSourceRuleModal').onclick = () => modals.source.style.display = 'none';
                        document.getElementById('closeIgnoreRuleModal').onclick = () => modals.ignore.style.display = 'none';
                        document.getElementById('closeTemplateModal').onclick = () => modals.template.style.display = 'none';
                        document.getElementById('modalAddTemplateBtn').onclick = () => { const t = prompt('输入新模板内容，可使用 {时间} {体力} 等变量'); if (t) { templates.push(t); saveData('templates', templates); renderTemplateList(); refreshTemplateSelect(); } };
                        document.getElementById('addOrUpdateRuleBtn').addEventListener('click', () => {
                            const p = document.getElementById('newRulePattern').value.trim();
                            const r = document.getElementById('newRuleReplacement').value.trim();
                            const t = document.getElementById('newRuleType').value;
                            if (!p) return;
                            if (editingSourceIndex >= 0) {
                                sourceRules[editingSourceIndex] = { pattern: p, replacement: r, type: t };
                            } else {
                                sourceRules.push({ pattern: p, replacement: r, type: t });
                            }
                            saveData('sourceRules', sourceRules);
                            renderSourceRuleList(document.getElementById('ruleTypeFilter').value, document.getElementById('ruleSearchInput').value);
                            resetSourceEditState();
                        });
                        document.getElementById('cancelEditRuleBtn').onclick = resetSourceEditState;
                        document.getElementById('resetDefaultSourceRulesBtn').onclick = () => { sourceRules = DEFAULT_SOURCE_RULES.map(r => ({ ...r })); saveData('sourceRules', sourceRules); renderSourceRuleList(); };
                        document.getElementById('clearAllSourceRulesBtn').onclick = () => { if (confirm('清空所有转换规则？')) { sourceRules = []; saveData('sourceRules', sourceRules); renderSourceRuleList(); } };
                        document.getElementById('addIgnoreKeywordBtn').onclick = () => { const kw = document.getElementById('newIgnoreKeyword').value.trim(); if (!kw) return; if (!ignoreKeywords.includes(kw)) { ignoreKeywords.push(kw); saveData('ignoreKeywords', ignoreKeywords); renderIgnoreRuleList(); document.getElementById('newIgnoreKeyword').value = ''; } };
                        document.getElementById('resetDefaultIgnoreRulesBtn').onclick = () => { ignoreKeywords = [...DEFAULT_IGNORE_KEYWORDS]; saveData('ignoreKeywords', ignoreKeywords); renderIgnoreRuleList(); };
                        document.getElementById('clearAllIgnoreRulesBtn').onclick = () => { if (confirm('清空所有忽略关键词？')) { ignoreKeywords = []; saveData('ignoreKeywords', ignoreKeywords); renderIgnoreRuleList(); } };

                        document.getElementById('uploadCsvBtn').onclick = processCardCsv;
                        document.getElementById('applyFilterBtn').onclick = processCardCsv;
                        document.getElementById('copyAllCardBtn').onclick = () => navigator.clipboard.writeText(document.getElementById('cardResultArea').value);
                        document.getElementById('exportCardBtn').onclick = () => { const blob = new Blob([document.getElementById('cardResultArea').value], { type: 'text/plain' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'card.txt'; a.click(); };
                        document.getElementById('debugCardBtn').onclick = async () => { const f = document.getElementById('csvFileInput').files[0]; if (!f) return; const text = await f.text(); alert('CSV前500字符:\n' + text.substring(0, 500)); };
                        document.getElementById('toggleTemplateHeader').onclick = () => { const c = document.getElementById('templateContent'); c.classList.toggle('collapsed'); document.getElementById('toggleArrow').textContent = c.classList.contains('collapsed') ? '▶' : '▼'; };
                        document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = function () {
                            document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
                            this.classList.add('active');
                            document.getElementById(`tab-${this.dataset.tab}`).classList.add('active');
                        });

                        const typeFilter = document.getElementById('ruleTypeFilter');
                        const searchInput = document.getElementById('ruleSearchInput');
                        const clearSearch = document.getElementById('clearRuleSearch');
                        typeFilter.onchange = () => renderSourceRuleList(typeFilter.value, searchInput.value);
                        searchInput.oninput = () => { clearSearch.style.display = searchInput.value ? 'inline' : 'none'; renderSourceRuleList(typeFilter.value, searchInput.value); };
                        clearSearch.onclick = () => { searchInput.value = ''; clearSearch.style.display = 'none'; renderSourceRuleList(typeFilter.value, ''); };
                        searchInput.onkeypress = (e) => { if (e.key === 'Enter') { const term = searchInput.value.trim(); if (!term) return; const items = document.querySelectorAll('#sourceRuleListContainer .rule-item'); for (let item of items) { if (item.textContent.toLowerCase().includes(term.toLowerCase())) { item.scrollIntoView({ behavior: 'smooth', block: 'center' }); break; } } } };

                        refreshVarEntries(); refreshTemplateSelect();
                    }

                    bindAll();
                    new Sortable(document.getElementById('tabsContainer'), { animation: 150 });
                    debugConsole.style.display = 'none';
                    debugConsole.innerHTML = '🟢 工作台就绪 · 完整功能正常';
                }) ();
        </script>
</body>
</html>
